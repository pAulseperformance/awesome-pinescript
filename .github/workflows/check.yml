name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  entries:
    name: awesome-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes awesome-lint

  links:
    name: every link resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_links.py
